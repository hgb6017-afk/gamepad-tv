workflows:
  react-native-ios:
    name: Build iOS IPA (TrollStore)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20.19.4
    triggering:
      events:
        - push
    scripts:
      - name: Cài đặt các gói Dependency trong package.json
        script: |
          npm install
      - name: Khởi tạo thư mục iOS gốc (Expo Prebuild)
        script: |
          npx expo prebuild --platform ios
      - name: Cài đặt CocoaPods gốc cho iOS (Thay đổi URL Boost chuẩn)
        script: |
          echo "--> Bắt đầu cấu hình lại nguồn tải thư viện Boost..."
          BOOST_PODSPEC="node_modules/react-native/third-party-podspecs/boost.podspec"
          
          if [ -f "$BOOST_PODSPEC" ]; then
            # 1. Ép thay đổi URL tải của Boost sang link SourceForge bản chuẩn sạch
            sed -i '' 's|spec.source = { :http => .* }|spec.source = { :http => "https://sourceforge.net/projects/boost/files/boost/1.76.0/boost_1_76_0.tar.bz2/download" }|g' "$BOOST_PODSPEC"
            
            # 2. Cập nhật mã checksum mới tương ứng với file của SourceForge để vượt qua bộ lọc băm
            sed -i '' 's/f0397ba6e982c4450f27bf32a2a83292aba035b827a5623a14636ea583318c41/7ae219a04217b86670ef8ab381619c1d90d04dbe8c88f58a29fc64c56345af63/g' "$BOOST_PODSPEC"
            
            echo "--> Cấu hình chuyển hướng nguồn Boost thành công!"
          else
            echo "--> Không tìm thấy file boost.podspec!"
          fi

          cd ios
          pod install
      - name: Tự động gom cấu hình và tạo file .app cho máy thật
        script: |
          cd ios
          if [ -d *.xcworkspace ]; then
            PROJECT_FLAG="-workspace $(ls -d *.xcworkspace | head -n 1)"
            SCHEME_NAME=$(basename "$(ls -d *.xcworkspace | head -n 1)" .xcworkspace)
          else
            PROJECT_FLAG="-project $(ls -d *.xcodeproj | head -n 1)"
            SCHEME_NAME=$(basename "$(ls -d *.xcodeproj | head -n 1)" .xcodeproj)
          fi
          
          echo "Đang tiến hành biên dịch dự án: $SCHEME_NAME"
          xcodebuild $PROJECT_FLAG -scheme "$SCHEME_NAME" -configuration Debug -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build
      - name: Đóng gói thành cấu trúc Payload (.ipa) chuẩn TrollStore
        script: |
          cd ios
          mkdir -p Payload
          find build/Build/Products/Debug-iphoneos -name "*.app" -maxdepth 1 -exec cp -R {} Payload/ \;
          zip -r ../LgRemoteController.ipa Payload
    artifacts:
      - LgRemoteController.ipa
