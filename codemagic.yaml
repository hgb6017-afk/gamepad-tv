workflows:
  react-native-ios:
    name: Build iOS IPA (TrollStore)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20.19.4
    triggering:
      events:
        - push
    scripts:
      - name: Cài đặt các gói Dependency trong package.json
        script: |
          npm install
      - name: Khởi tạo thư mục iOS gốc (Expo Prebuild)
        script: |
          npx expo prebuild --platform ios
      - name: Cài đặt CocoaPods gốc cho iOS (Ghi đè cấu hình chuẩn Boost)
        script: |
          echo "--> Đang tiến hành tạo mới hoàn toàn cấu hình chuẩn cho Boost..."
          BOOST_PODSPEC="node_modules/react-native/third-party-podspecs/boost.podspec"
          
          if [ -f "$BOOST_PODSPEC" ]; then
            # Ghi đè file bằng lệnh echo chuỗi an toàn, loại bỏ hoàn toàn lỗi cú pháp YAML
            echo "Pod::Spec.new do |spec|" > "$BOOST_PODSPEC"
            echo "  spec.name = 'boost'" >> "$BOOST_PODSPEC"
            echo "  spec.version = '1.76.0'" >> "$BOOST_PODSPEC"
            echo "  spec.license = { :type => 'Boost Software License' }" >> "$BOOST_PODSPEC"
            echo "  spec.homepage = 'http://www.boost.org'" >> "$BOOST_PODSPEC"
            echo "  spec.summary = 'Boost provides free peer-reviewed portable C++ source libraries.'" >> "$BOOST_PODSPEC"
            echo "  spec.authors = 'Rene Rivera'" >> "$BOOST_PODSPEC"
            echo "  spec.source = { :http => 'https://sourceforge.net/projects/boost/files/boost/1.76.0/boost_1_76_0.tar.bz2/download', :sha256 => '7ae219a04217b86670ef8ab381619c1d90d04dbe8c88f58a29fc64c56345af63' }" >> "$BOOST_PODSPEC"
            echo "  spec.header_mappings_dir = 'boost'" >> "$BOOST_PODSPEC"
            echo "end" >> "$BOOST_PODSPEC"
            echo "--> Đã cấu hình nguồn tải Boost sạch về SourceForge thành công!"
          else
            echo "--> Không tìm thấy file podspec của boost."
          fi

          cd ios
          pod install
      - name: Tự động gom cấu hình và tạo file .app cho máy thật
        script: |
          cd ios
          echo "--> Biên dịch ứng dụng Xcode với scheme 'main' mặc định của Expo..."
          xcodebuild -workspace main.xcworkspace -scheme "main" -configuration Debug -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build
      - name: Đóng gói thành cấu trúc Payload (.ipa) chuẩn TrollStore
        script: |
          cd ios
          mkdir -p Payload
          find build/Build/Products/Debug-iphoneos -name "*.app" -maxdepth 1 -exec cp -R {} Payload/ \;
          zip -r ../LgRemoteController.ipa Payload
    artifacts:
      - LgRemoteController.ipa
