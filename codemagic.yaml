workflows:
  react-native-ios:
    name: Build iOS IPA (TrollStore)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20.19.4
      # Đã xóa dòng ép buộc Xcode cũ để hệ thống dùng bản mặc định tốt nhất
    triggering:
      events:
        - push
    scripts:
      - name: Cài đặt các gói Dependency trong package.json
        script: |
          npm install
      - name: Khởi tạo thư mục iOS gốc (Expo Prebuild)
        script: |
          npx expo prebuild --platform ios
      - name: Vá lỗi Boost & Ép Xcode bỏ qua lỗi C++
        script: |
          echo "--> Sửa tệp cấu hình Boost..."
          BOOST_PODSPEC="node_modules/react-native/third-party-podspecs/boost.podspec"
          
          if [ -f "$BOOST_PODSPEC" ]; then
            echo "Pod::Spec.new do |spec|" > "$BOOST_PODSPEC"
            echo "  spec.name = 'boost'" >> "$BOOST_PODSPEC"
            echo "  spec.version = '1.76.0'" >> "$BOOST_PODSPEC"
            echo "  spec.license = { :type => 'Boost Software License' }" >> "$BOOST_PODSPEC"
            echo "  spec.homepage = 'http://www.boost.org'" >> "$BOOST_PODSPEC"
            echo "  spec.summary = 'Boost provides free peer-reviewed portable C++ source libraries.'" >> "$BOOST_PODSPEC"
            echo "  spec.authors = 'Rene Rivera'" >> "$BOOST_PODSPEC"
            echo "  spec.source = { :http => 'https://sourceforge.net/projects/boost/files/boost/1.76.0/boost_1_76_0.tar.bz2/download', :sha256 => 'f0397ba6e982c4450f27bf32a2a83292aba035b827a5623a14636ea583318c41', :type => :tbz }" >> "$BOOST_PODSPEC"
            echo "  spec.source_files = 'boost/**/*.{{h,hpp,ipp}}'" >> "$BOOST_PODSPEC"
            echo "  spec.header_mappings_dir = '.'" >> "$BOOST_PODSPEC"
            echo "end" >> "$BOOST_PODSPEC"
          fi

          echo "--> Tiêm mã vô hiệu hóa chữ ký và tắt kiểm tra lỗi C++ nghiêm ngặt..."
          cat << 'EOF' >> ios/Podfile
          
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                # 1. Tắt hoàn toàn chữ ký ứng dụng
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGNING_IDENTITY'] = ''
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
                
                # 2. VÁ LỖI C++ (YGValue.cpp): Ép Xcode không được coi cảnh báo là lỗi
                config.build_settings['GCC_TREAT_WARNINGS_AS_ERRORS'] = 'NO'
                config.build_settings['WARNING_CFLAGS'] = '-Wno-everything'
              end
            end
          end
          EOF

          cd ios && pod install
      - name: Biên dịch hệ thống (Bản chính thức - Release Mode)
        script: |
          cd ios
          echo "--> Tiến hành build ứng dụng độc lập không cần chứng chỉ..."
          
          xcodebuild -workspace LgRemoteController.xcworkspace \
                     -scheme LgRemoteController \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_IDENTITY="" \
                     clean build
      - name: Trích xuất và cấu trúc tệp Payload .ipa cho TrollStore
        script: |
          cd ios
          mkdir -p Payload
          
          echo "--> Quét tìm thông minh file .app trong thư mục Release..."
          find build/Build/Products -name "*.app" -type d -exec cp -R {} Payload/ \;
          
          echo "--> Đóng gói thành file cài đặt .ipa cuối cùng..."
          zip -r ../LgRemoteController.ipa Payload
    artifacts:
      - LgRemoteController.ipa
