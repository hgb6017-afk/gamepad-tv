workflows:
  react-native-ios:
    name: Build iOS IPA (TrollStore)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20.19.4
    triggering:
      events:
        - push
    scripts:
      - name: Install Node & Dependencies
        script: |
          sudo ln -s $(command -v node) /usr/local/bin/node || true
          npm install

      - name: Expo Prebuild
        script: |
          npx expo prebuild --platform ios --clean
          echo "export NODE_BINARY=$(command -v node)" > ios/.xcode.env
          echo "export NODE_BINARY=$(command -v node)" > ios/.xcode.env.local

      - name: Patch Boost
        script: |
          echo "--> Patching Boost..."
          BOOST_PODSPEC="node_modules/react-native/third-party-podspecs/boost.podspec"
          if [ -f "$BOOST_PODSPEC" ]; then
            cat > "$BOOST_PODSPEC" << 'EOF'
            Pod::Spec.new do |spec|
              spec.name = 'boost'
              spec.version = '1.76.0'
              spec.license = { :type => 'Boost Software License' }
              spec.homepage = 'http://www.boost.org'
              spec.summary = 'Boost provides free peer-reviewed portable C++ source libraries.'
              spec.authors = 'Rene Rivera'
              spec.source = { :http => 'https://sourceforge.net/projects/boost/files/boost/1.76.0/boost_1_76_0.tar.bz2/download', :sha256 => 'f0397ba6e982c4450f27bf32a2a83292aba035b827a5623a14636ea583318c41', :type => :tbz }
              spec.source_files = 'boost/**/*.{{h,hpp,ipp}}'
              spec.header_mappings_dir = '.'
            end
          EOF
          fi

      - name: Pod Install & Strip Scripts
        script: |
          cd ios
          pod install
          
          echo "--> Fixing DT_TOOLCHAIN_DIR..."
          find Pods -type f -name '*.sh' -exec sed -i '' -e 's/DT_TOOLCHAIN_DIR/TOOLCHAIN_DIR/g' {} +
          find Pods -type f -name '*.xcconfig' -exec sed -i '' -e 's/DT_TOOLCHAIN_DIR/TOOLCHAIN_DIR/g' {} +
          
          echo "--> Disabling Code Signing in CocoaPods scripts..."
          find Pods -type f -name '*.sh' -exec sed -i '' 's/code_sign_if_enabled/echo "Skipped codesign"/g' {} +

      - name: Ultimate Xcode Project Patcher (Ruby)
        script: |
          cat > patch_pbxproj.rb << 'EOF'
          require 'xcodeproj'
          
          # 1. Tắt chữ ký cho App chính
          main_project_path = 'ios/LgRemoteController.xcodeproj'
          if File.exist?(main_project_path)
            main_project = Xcodeproj::Project.open(main_project_path)
            main_project.build_configurations.each do |config|
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
              config.build_settings['CODE_SIGN_IDENTITY'] = ''
              config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
              config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
            end
            main_project.save
            puts "--> Main Project Patched!"
          end

          # 2. Xâm nhập vào Pods.xcodeproj để cứu Folly
          pods_project_path = 'ios/Pods/Pods.xcodeproj'
          if File.exist?(pods_project_path)
            pods_project = Xcodeproj::Project.open(pods_project_path)
            pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                config.build_settings['GCC_TREAT_WARNINGS_AS_ERRORS'] = 'NO'
                
                # Bơm thần chú C++ thẳng vào mạch máu của Folly
                cpp_flags = config.build_settings['OTHER_CPLUSPLUSFLAGS']
                cpp_str = [cpp_flags].compact.flatten.join(' ')
                config.build_settings['OTHER_CPLUSPLUSFLAGS'] = cpp_str + ' -D_LIBCPP_ENABLE_CXX17_REMOVED_UNARY_BINARY_FUNCTION=1 -Wno-everything'
                
                c_flags = config.build_settings['OTHER_CFLAGS']
                c_str = [c_flags].compact.flatten.join(' ')
                config.build_settings['OTHER_CFLAGS'] = c_str + ' -Wno-everything'
              end
            end
            pods_project.save
            puts "--> Pods Project Patched! Folly has been cured!"
          end
          EOF
          gem install xcodeproj
          ruby patch_pbxproj.rb

      - name: Build Application (Release)
        script: |
          cd ios
          xcodebuild -workspace LgRemoteController.xcworkspace \
                     -scheme LgRemoteController \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_IDENTITY="" \
                     ENABLE_USER_SCRIPT_SANDBOXING=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     clean build

      - name: Package IPA
        script: |
          cd ios
          mkdir -p Payload
          find build/Build/Products -name "*.app" -type d -exec cp -R {} Payload/ \;
          zip -r ../LgRemoteController.ipa Payload
    artifacts:
      - LgRemoteController.ipa
