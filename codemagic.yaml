workflows:
  react-native-ios:
    name: Build iOS IPA (TrollStore)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20.19.4
    triggering:
      events:
        - push
    scripts:
      - name: Cài đặt các gói Dependency trong package.json
        script: |
          npm install
      - name: Khởi tạo thư mục iOS gốc (Expo Prebuild)
        script: |
          npx expo prebuild --platform ios
      - name: Cài đặt CocoaPods gốc cho iOS (Ghi đè cấu hình chuẩn Boost)
        script: |
          echo "--> Đang tiến hành sửa đổi tệp tin cấu hình Podspec của Boost..."
          BOOST_PODSPEC="node_modules/react-native/third-party-podspecs/boost.podspec"
          
          if [ -f "$BOOST_PODSPEC" ]; then
            echo "Pod::Spec.new do |spec|" > "$BOOST_PODSPEC"
            echo "  spec.name = 'boost'" >> "$BOOST_PODSPEC"
            echo "  spec.version = '1.76.0'" >> "$BOOST_PODSPEC"
            echo "  spec.license = { :type => 'Boost Software License' }" >> "$BOOST_PODSPEC"
            echo "  spec.homepage = 'http://www.boost.org'" >> "$BOOST_PODSPEC"
            echo "  spec.summary = 'Boost provides free peer-reviewed portable C++ source libraries.'" >> "$BOOST_PODSPEC"
            echo "  spec.authors = 'Rene Rivera'" >> "$BOOST_PODSPEC"
            echo "  spec.source = { :http => 'https://sourceforge.net/projects/boost/files/boost/1.76.0/boost_1_76_0.tar.bz2/download', :sha256 => 'f0397ba6e982c4450f27bf32a2a83292aba035b827a5623a14636ea583318c41', :type => :tbz }" >> "$BOOST_PODSPEC"
            echo "  spec.source_files = 'boost/**/*.{{h,hpp,ipp}}'" >> "$BOOST_PODSPEC"
            echo "  spec.header_mappings_dir = '.'" >> "$BOOST_PODSPEC"
            echo "end" >> "$BOOST_PODSPEC"
            echo "--> Đã ghi đè thành công nguồn tải Boost sạch cấu hình chuẩn!"
          fi

          cd ios && pod install
      - name: Biên dịch hệ thống và Đóng gói Xcode Archive
        script: |
          cd ios
          echo "--> Tiến hành Archive dự án tạo bản phân phối chuẩn..."
          
          # Sử dụng lệnh archive để gom toàn bộ app và framework thành 1 gói duy nhất
          xcodebuild -workspace LgRemoteController.xcworkspace \
                     -scheme LgRemoteController \
                     -configuration Debug \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/LgRemoteController.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean archive
      - name: Trích xuất file .app và tạo cấu trúc IPA cho TrollStore
        script: |
          cd ios
          mkdir -p Payload
          echo "--> Đang trích xuất file .app từ gói Archive đã dựng..."
          
          # Sao chép trực tiếp file .app từ trong gói Archive ra thư mục Payload
          cp -R build/LgRemoteController.xcarchive/Products/Applications/*.app Payload/
          
          echo "--> Nén thư mục Payload thành file cài đặt .ipa cuối cùng..."
          zip -r ../LgRemoteController.ipa Payload
    artifacts:
      - LgRemoteController.ipa
