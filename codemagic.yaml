workflows:
  react-native-ios:
    name: Build iOS IPA (TrollStore)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20.19.4
      xcode: 14.3.1 # <-- CHÌA KHÓA VÀNG LÀ ĐÂY: Hạ cấp Xcode để tương thích hoàn toàn với Folly/React Native 0.72
    triggering:
      events:
        - push
    scripts:
      - name: Cài đặt các gói Dependency trong package.json
        script: |
          npm install
      - name: Khởi tạo thư mục iOS gốc (Expo Prebuild)
        script: |
          npx expo prebuild --platform ios
      - name: Vá lỗi Boost & Trộn mã sửa lỗi vào Podfile gốc
        script: |
          echo "--> Sửa tệp cấu hình Boost..."
          BOOST_PODSPEC="node_modules/react-native/third-party-podspecs/boost.podspec"
          
          if [ -f "$BOOST_PODSPEC" ]; then
            echo "Pod::Spec.new do |spec|" > "$BOOST_PODSPEC"
            echo "  spec.name = 'boost'" >> "$BOOST_PODSPEC"
            echo "  spec.version = '1.76.0'" >> "$BOOST_PODSPEC"
            echo "  spec.license = { :type => 'Boost Software License' }" >> "$BOOST_PODSPEC"
            echo "  spec.homepage = 'http://www.boost.org'" >> "$BOOST_PODSPEC"
            echo "  spec.summary = 'Boost provides free peer-reviewed portable C++ source libraries.'" >> "$BOOST_PODSPEC"
            echo "  spec.authors = 'Rene Rivera'" >> "$BOOST_PODSPEC"
            echo "  spec.source = { :http => 'https://sourceforge.net/projects/boost/files/boost/1.76.0/boost_1_76_0.tar.bz2/download', :sha256 => 'f0397ba6e982c4450f27bf32a2a83292aba035b827a5623a14636ea583318c41', :type => :tbz }" >> "$BOOST_PODSPEC"
            echo "  spec.source_files = 'boost/**/*.{{h,hpp,ipp}}'" >> "$BOOST_PODSPEC"
            echo "  spec.header_mappings_dir = '.'" >> "$BOOST_PODSPEC"
            echo "end" >> "$BOOST_PODSPEC"
          fi

          echo "--> Dùng Ruby trộn mã sửa lỗi trực tiếp vào bên trong post_install của Expo..."
          ruby -e '
            file_path = "ios/Podfile"
            if File.exist?(file_path)
              content = File.read(file_path)
              patch = "\n  installer.pods_project.targets.each do |target|\n    target.build_configurations.each do |config|\n      config.build_settings[\"CODE_SIGNING_ALLOWED\"] = \"NO\"\n      config.build_settings[\"CODE_SIGNING_REQUIRED\"] = \"NO\"\n      config.build_settings[\"CODE_SIGNING_IDENTITY\"] = \"\"\n      config.build_settings[\"EXPANDED_CODE_SIGN_IDENTITY\"] = \"\"\n      config.build_settings[\"GCC_TREAT_WARNINGS_AS_ERRORS\"] = \"NO\"\n      config.build_settings[\"WARNING_CFLAGS\"] = \"-Wno-everything\"\n      config.build_settings[\"IPHONEOS_DEPLOYMENT_TARGET\"] = \"14.0\"\n    end\n  end\n"
              if content.match(/post_install\s*do\s*\|\s*installer\s*\|/)
                content.sub!(/post_install\s*do\s*\|\s*installer\s*\|/, "post_install do |installer|#{patch}")
                File.write(file_path, content)
                puts "--> Đã hòa trộn mã cấu hình sửa lỗi thành công!"
              else
                puts "--> Không tìm thấy khối post_install gốc!"
              end
            else
              puts "--> Không tìm thấy Podfile!"
            end
          '
          cd ios && pod install
          
          echo "--> VÁ LỖI DT_TOOLCHAIN_DIR..."
          find Pods -type f -name '*.sh' -exec sed -i '' -e 's/DT_TOOLCHAIN_DIR/TOOLCHAIN_DIR/g' {} +
          find Pods -type f -name '*.xcconfig' -exec sed -i '' -e 's/DT_TOOLCHAIN_DIR/TOOLCHAIN_DIR/g' {} +

      - name: Biên dịch hệ thống (Bản chính thức - Release Mode)
        script: |
          cd ios
          echo "--> Bơm đường dẫn Node.js cho Hermes Engine..."
          export NODE_BINARY=$(command -v node)
          echo "--> Tiến hành biên dịch ứng dụng độc lập không cần chứng chỉ..."
          xcodebuild -workspace LgRemoteController.xcworkspace \
                     -scheme LgRemoteController \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_IDENTITY="" \
                     clean build

      - name: Trích xuất và cấu trúc tệp Payload .ipa cho TrollStore
        script: |
          cd ios
          mkdir -p Payload
          find build/Build/Products -name "*.app" -type d -exec cp -R {} Payload/ \;
          echo "--> Đóng gói thành file cài đặt .ipa cuối cùng..."
          zip -r ../LgRemoteController.ipa Payload
    artifacts:
      - LgRemoteController.ipa
