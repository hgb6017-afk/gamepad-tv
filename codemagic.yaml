workflows:
  react-native-ios:
    name: Build iOS IPA (TrollStore)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20.19.4
    triggering:
      events:
        - push
    scripts:
      - name: Nâng cấp Hệ thống & Cài đặt Dependency
        script: |
          echo "--> ÉP CẬP NHẬT COCOAPODS MỚI NHẤT ĐỂ VÁ LỖI SCRIPT CỦA XCODE 15..."
          sudo gem install cocoapods
          npm install

      - name: Khởi tạo thư mục iOS (Expo Prebuild)
        script: |
          npx expo prebuild --platform ios --clean
          echo "export NODE_BINARY=$(command -v node)" > ios/.xcode.env.local

      - name: Vá lỗi Boost
        script: |
          BOOST_PODSPEC="node_modules/react-native/third-party-podspecs/boost.podspec"
          if [ -f "$BOOST_PODSPEC" ]; then
            cat > "$BOOST_PODSPEC" << 'EOF'
            Pod::Spec.new do |spec|
              spec.name = 'boost'
              spec.version = '1.76.0'
              spec.license = { :type => 'Boost Software License' }
              spec.homepage = 'http://www.boost.org'
              spec.summary = 'Boost provides free peer-reviewed portable C++ source libraries.'
              spec.authors = 'Rene Rivera'
              spec.source = { :http => 'https://sourceforge.net/projects/boost/files/boost/1.76.0/boost_1_76_0.tar.bz2/download', :sha256 => 'f0397ba6e982c4450f27bf32a2a83292aba035b827a5623a14636ea583318c41', :type => :tbz }
              spec.source_files = 'boost/**/*.{{h,hpp,ipp}}'
              spec.header_mappings_dir = '.'
            end
          EOF
          fi

      - name: Tắt chữ ký mã bằng Ruby (TrollStore)
        script: |
          cat > patch_podfile.rb << 'EOF'
          file_path = "ios/Podfile"
          exit unless File.exist?(file_path)
          
          content = File.read(file_path)
          patch = %q{
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                config.build_settings["CODE_SIGNING_IDENTITY"] = ""
                config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""
                config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "14.0"
              end
            end
          }
          if content.match(/post_install\s*do\s*\|\s*installer\s*\|/)
            content.sub!(/post_install\s*do\s*\|\s*installer\s*\|/, "post_install do |installer|\n#{patch}")
            File.write(file_path, content)
          end
          EOF
          ruby patch_podfile.rb

      - name: Cài đặt Pods & Ép buộc Cấu hình Tuyệt đối
        script: |
          cd ios
          pod install
          
          echo "--> VÁ LỖI DT_TOOLCHAIN_DIR..."
          find Pods -type f -name '*.sh' -exec sed -i '' -e 's/DT_TOOLCHAIN_DIR/TOOLCHAIN_DIR/g' {} +
          find Pods -type f -name '*.xcconfig' -exec sed -i '' -e 's/DT_TOOLCHAIN_DIR/TOOLCHAIN_DIR/g' {} +
          
          echo "--> BƠM THẦN CHÚ C++ VÀ ĐẬP TAN HỘP CÁT SANDBOX TỪ ĐÁY FILE XCCONFIG..."
          find Pods -type f -name '*.xcconfig' -print0 | while IFS= read -r -d '' file; do
            echo 'OTHER_CPLUSPLUSFLAGS = $(inherited) -D_LIBCPP_ENABLE_CXX17_REMOVED_UNARY_BINARY_FUNCTION=1 -Wno-everything' >> "$file"
            echo 'OTHER_CFLAGS = $(inherited) -Wno-everything' >> "$file"
            echo 'WARNING_CFLAGS = $(inherited) -Wno-everything' >> "$file"
            echo 'ENABLE_USER_SCRIPT_SANDBOXING = NO' >> "$file"
          done

      - name: Biên dịch ứng dụng (Bản chính thức)
        script: |
          cd ios
          echo "--> Xung phong! Bắt đầu biên dịch..."
          xcodebuild -workspace LgRemoteController.xcworkspace \
                     -scheme LgRemoteController \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_IDENTITY="" \
                     ENABLE_USER_SCRIPT_SANDBOXING=NO \
                     clean build

      - name: Đóng gói tệp IPA
        script: |
          cd ios
          mkdir -p Payload
          find build/Build/Products -name "*.app" -type d -exec cp -R {} Payload/ \;
          zip -r ../LgRemoteController.ipa Payload
    artifacts:
      - LgRemoteController.ipa
