name: Kich Hoat Remote Desktop MacOS
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Tải Ngrok bản Apple Silicon siêu tốc (Fix lỗi Treo máy)
        run: |
          # Tải đúng bản ARM64 dành cho chip Apple M1/M2 trên máy ảo GitHub
          curl -Lk https://bin.equinox.io/c/bNyj1mQcaMx/ngrok-v3-stable-darwin-arm64.zip -o ngrok.zip
          unzip ngrok.zip
          sudo mv ngrok /usr/local/bin/

      - name: Cấu hình và Xác thực Token Ngrok
        run: |
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          
      - name: Kích hoạt Screen Sharing (Remote Desktop)
        run: |
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCEverywhere -bool true
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          
      - name: Thiết lập mật khẩu máy Mac (@Baohg123)
        run: |
          sudo dscl . -passwd /Users/runner @Baohg123
          
      - name: Mở cổng kết nối công khai
        run: |
          # Ép chạy trên vùng Châu Á (ap) để kết nối từ VN/VPS được mượt nhất
          ngrok tcp --region=ap 5900
