name: Build iOS IPA (TrollStore)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-13 # ĐÂY LÀ CHÌA KHÓA: Máy chủ macOS 13 sử dụng Xcode 14 chuẩn chỉ!
    
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v3

      - name: Cài đặt Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Cài đặt Dependency
        run: npm install

      - name: Khởi tạo thư mục iOS (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: Cài đặt CocoaPods
        run: |
          cd ios
          pod install

      - name: Biên dịch ứng dụng (Tắt chữ ký mã)
        run: |
          cd ios
          xcodebuild -workspace LgRemoteController.xcworkspace \
                     -scheme LgRemoteController \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_IDENTITY="" \
                     clean build

      - name: Đóng gói thành file .ipa
        run: |
          cd ios
          mkdir -p Payload
          # Tìm đúng file .app vừa build xong và copy vào Payload
          find build/Build/Products -name "*.app" -type d -exec cp -R {} Payload/ \;
          zip -r ../LgRemoteController.ipa Payload

      - name: Trả file .ipa về cho bạn tải xuống
        uses: actions/upload-artifact@v3
        with:
          name: LgRemoteController-TrollStore
          path: ios/LgRemoteController.ipa
