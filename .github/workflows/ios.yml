name: Build iOS IPA (TrollStore)
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-13 # Dùng bản macOS 13 vừa đủ và cực kỳ hợp với Expo SDK 49
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.19.4 # Khớp chính xác với phiên bản Node trên VPS của bạn

      - name: Cài đặt Expo CLI toàn cục
        run: npm install -g eas-cli

      - name: Cài đặt các gói Dependency trong package.json
        run: npm install

      - name: Khởi tạo thư mục iOS gốc (Prebuild)
        run: npx expo prebuild --platform ios

      - name: Tự động cài đặt CocoaPods (Bước này cực kỳ quan trọng)
        run: |
          cd ios
          pod install
          cd ..

      - name: Gom tất cả vào thư mục Payload chuẩn cho TrollStore
        run: |
          mkdir Payload
          # Tự động tìm file .app vừa tạo ra để nhét vào thư mục Payload
          find . -name "*.app" -type d -exec cp -R {} Payload/ \; 2>/dev/null || true

      - name: Nén thành file .ipa vĩnh viễn
        run: zip -r LgRemoteController.ipa Payload

      - name: Đẩy file IPA lên hệ thống để bạn tải về VPS
        uses: actions/upload-artifact@v3
        with:
          name: App-TrollStore-ARM64
          path: LgRemoteController.ipa
