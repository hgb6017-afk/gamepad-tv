name: Kich Hoat Remote Desktop MacOS
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép bạn bấm nút kích hoạt thủ công bất cứ lúc nào

jobs:
  build:
    runs-on: macos-13 # Bản macOS 13 chuẩn chỉnh, chạy rất mượt và ổn định
    steps:
      - name: Tải và cài đặt Ngrok để tạo đường truyền
        run: |
          brew install --cask ngrok
          
      - name: Khai báo Token kết nối Ngrok
        run: |
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          
      - name: Kích hoạt tính năng Screen Sharing (Remote Desktop) trên máy Mac
        run: |
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCEverywhere -bool true
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          
      - name: Tạo mật khẩu đăng nhập máy Mac
        run: |
          # Đặt mật khẩu đăng nhập máy Mac là: @Baohg123
          sudo dscl . -passwd /Users/runner @Baohg123
          
      - name: Mở cổng kết nối công khai (Giữ máy chạy trong 6 tiếng)
        run: |
          ngrok tcp 5900 --region ap
